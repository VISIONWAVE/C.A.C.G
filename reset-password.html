<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Christ Alone Prayer Mountain</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--color-navy) 0%,var(--color-navy-dark) 100%);padding:24px 0}
.login-card{background:var(--color-white);border-radius:var(--radius-lg);padding:36px;max-width:440px;width:calc(100% - 32px);box-shadow:var(--shadow-lg);text-align:center}
.login-card img{width:58px;height:58px;object-fit:cover;border-radius:50%;margin:0 auto 16px}
.intro{color:var(--color-text-muted);font-size:.9rem;line-height:1.6;margin:0 auto 22px}
.form-group{margin-bottom:15px;text-align:left}
.form-group label{display:block;margin-bottom:7px;font-size:.83rem;font-weight:600}
.form-group input{width:100%;box-sizing:border-box}
.password{position:relative}
.password input{padding-right:65px}
.show{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--color-gold-deep);font:600 .76rem Inter,sans-serif;cursor:pointer}
.submit{width:100%;margin-top:5px}
.message{display:none;border-radius:8px;padding:10px 12px;margin-bottom:15px;font-size:.8rem;line-height:1.45;text-align:left}
.message.show{display:block}
.message.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
.message.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.back{display:inline-block;margin-top:22px;color:var(--color-gold-deep);font-size:.82rem;font-weight:600}
@media(max-width:480px){.login-card{padding:28px 20px}}
</style>
</head>
<body>
<main class="login-card">
<img src="images/logo.jpg" alt="Christ Alone Prayer Mountain">
<p class="eyebrow" style="justify-content:center">Reset Password</p>
<h2 style="margin-bottom:8px">Choose a New Password</h2>
<p class="intro" id="intro">Enter a new password for your Prophetic School account.</p>
<div id="message" class="message" role="alert"></div>
<form id="resetForm" novalidate>
<div class="form-group"><label for="password">New password</label><div class="password"><input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button class="show" type="button" data-target="password">Show</button></div></div>
<div class="form-group"><label for="confirm">Confirm new password</label><div class="password"><input type="password" id="confirm" required minlength="8" autocomplete="new-password" placeholder="Repeat your password"><button class="show" type="button" data-target="confirm">Show</button></div></div>
<button class="btn btn-primary submit" id="submitBtn" type="submit">Update Password</button>
</form>
<a href="login.html" class="back">&larr; Back to Sign In</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-shared.js"></script>
<script>
(() => {
const msg=document.getElementById('message');
const form=document.getElementById('resetForm');
function message(text,type='error'){msg.textContent=text;msg.className='message show '+type}
document.querySelectorAll('.show').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.target);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide'});

let _client=null;
function client(){ if(!_client) _client=cacgCreateAuthClient(); return _client; }

// The reset-password email link lands here with a recovery token in the
// URL — cacgCreateAuthClient()'s detectSessionInUrl handles turning that
// into a real (temporary) session automatically. If someone just opens
// this page directly without a valid link, there's no session and no
// harmless way to "reset a password" without one, so we tell them plainly.
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const { data } = await client().auth.getSession();
    if (!data.session) {
      message('This link is invalid or has expired — request a new password reset from the sign-in page.');
      form.querySelectorAll('input,button[type="submit"]').forEach(el=>el.disabled=true);
    }
  } catch (x) {
    message(x.message||'Could not verify this reset link.');
  }
});

form.onsubmit=async e=>{
  e.preventDefault();
  const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,b=document.getElementById('submitBtn');
  if(password.length<8)return message('Your password must contain at least 8 characters.');
  if(password!==confirm)return message('The passwords do not match.');
  b.disabled=true;b.textContent='Updating...';
  try{
    const { error } = await client().auth.updateUser({ password });
    if (error) throw error;
    message('Password updated. Redirecting you to sign in...','success');
    setTimeout(()=>location.href='login.html',1200);
  }catch(x){
    message(x.message||'Could not update your password.');
  }finally{b.disabled=false;b.textContent='Update Password'}
};
})();
</script>
</body>
</html>
